# Default values for spryzen enterprise helm chart.

replicaCount: 2

image:
  repository: ghcr.io/aditya-9-6/spryzen
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Spryzen Enterprise Core Configuration
spryzen:
  # Enforcement Mode: "simulate" (zero risk audit) or "block" (active enforcement)
  mode: "simulate"
  
  # Upstream target to protect (e.g. "http://backend-service:8080")
  upstreamUrl: "http://backend-service:8080"
  
  port: 8080
  timeoutMs: 10000
  maxBodyBytes: 10485760

  # Token-bucket Rate Limiter
  rateLimit:
    enabled: true
    requestsPerSecond: 5000
    burst: 10000

  # Observability & SIEM Logging
  logging:
    format: "json"
    maskHeaders:
      - "authorization"
      - "cookie"
      - "x-api-key"
      - "proxy-authorization"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spryzen.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
