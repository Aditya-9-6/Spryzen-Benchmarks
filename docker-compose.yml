# =============================================================================
# Spryzen+ (IronWall WAF) — Production Drop-in Reverse Proxy Demo
# Protect any backend service in 30 seconds with 12µs P50 latency WAF shielding
# =============================================================================

version: '3.8'

services:
  # --- SPRYZEN BARE-METAL WAF REVERSE PROXY ---
  spryzen:
    image: ghcr.io/aditya-9-6/spryzen:latest
    container_name: spryzen-waf
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAM_URL=http://demo-backend:5678
      - RUST_LOG=info
    restart: always
    depends_on:
      - demo-backend

  # --- EXAMPLE UPSTREAM BACKEND SERVICE ---
  demo-backend:
    image: hashicorp/http-echo:latest
    container_name: demo-backend
    command: ["-text={\"status\":\"ok\",\"message\":\"Hello from your backend, shielded by Spryzen!\"}"]
    ports:
      - "5678:5678"
    restart: always
