# =============================================================================
# Spryzen+ (IronWall WAF) — Production Enterprise Configuration
# Sub-Microsecond Sovereign WAF & API Security Gateway
# =============================================================================

[server]
# Address and port to bind to
listen = "0.0.0.0:8080"

# Target upstream backend URL (leave empty or omit for standalone benchmark mode)
# upstream = "http://127.0.0.1:3000"

# Enforcement mode:
#   "block"    -> Actively reject threats with HTTP 403 Forbidden
#   "simulate" -> Audit only: record threats, attach x-spryzen headers, forward cleanly (0% customer risk)
#   "bypass"   -> Passthrough without inspection
mode = "block"

# Upstream proxy timeout in milliseconds
timeout_ms = 10000

# Maximum request body size in bytes to prevent DoS memory exhaustion (10 MB default)
max_body_bytes = 10485760

[rate_limit]
# In-memory token bucket rate limiting per client IP
enabled = true
requests_per_second = 100000
burst = 200000

[allowlist]
# Paths to bypass inspection (supports prefix wildcard with *)
paths = [
    "/health",
    "/metrics",
    "/_spryzen/*",
    "/favicon.ico"
]

# Trusted CIDRs / IP addresses to bypass inspection (e.g. "10.0.0.0/8")
ips = []

[logging]
# Structured log output format: "json" (for Datadog/Splunk/CloudWatch) or "text"
format = "json"

# Headers automatically redacted in SIEM logs for SOC 2 / HIPAA / PCI-DSS compliance
mask_headers = [
    "authorization",
    "cookie",
    "x-api-key",
    "proxy-authorization"
]
